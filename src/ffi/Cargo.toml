[package]
name = "udaya-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Udaya FFI bindings for Flutter/Android integration"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
udaya-core = { path = "../core" }
udaya-storage = { path = "../storage" }
udaya-wallet = { path = "../wallet" }

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
chrono.workspace = true
hex.workspace = true
base64 = "0.21"
bincode = "1.3"

[build-dependencies]
cbindgen = { version = "0.26", optional = true }

[features]
default = ["generate_header"]
generate_header = ["cbindgen"]
