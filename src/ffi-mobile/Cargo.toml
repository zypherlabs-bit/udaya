[package]
name = "udaya-ffi-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight Udaya FFI bindings for mobile (no RocksDB dependency)"

[lib]
crate-type = ["cdylib"]

[dependencies]
udaya-core = { path = "../core" }
udaya-wallet = { path = "../wallet" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
chrono.workspace = true
hex.workspace = true
base64 = "0.21"

[build-dependencies]
cbindgen = { version = "0.26", optional = true }

[features]
default = ["generate_header"]
generate_header = ["cbindgen"]
