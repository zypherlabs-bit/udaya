# Udaya Mainnet Faucet Configuration
# Deployment-ready configuration for testnet faucet service

# Global Faucet Configuration
[global]
network = "testnet"
chain = "udaya"
protocol_version = 70015
user_agent = "/Udaya-Faucet:1.0.0/"
timeout_seconds = 30
max_connections = 500
ban_threshold = 20
ban_duration_hours = 24

# Faucet Service Configuration
[faucet]
name = "udaya-faucet-testnet"
location = "Multiple Regions"
hostname = "faucet.udaya.net"
ip_addresses = [
    "104.248.120.120",  # US East
    "172.67.180.120"    # US West
]
port = 8081
monitoring_port = 18081
health_check = "/health"
dns_records = [
    "faucet.udaya.net",
    "faucet.udaya.org",
    "testnet-faucet.udaya.net"
]

# Web Server Configuration
[web_server]
listen_address = "0.0.0.0"
listen_port = 8081
ssl_enabled = true
ssl_certificate = "/etc/udaya/tls/faucet-cert.pem"
ssl_key = "/etc/udaya/tls/faucet-key.pem"
ssl_ca = "/etc/udaya/tls/ca.pem"
max_request_size_mb = 5
max_response_size_mb = 10
max_concurrent_requests = 100
request_timeout_seconds = 15
idle_timeout_seconds = 60
static_files_dir = "/var/www/faucet/static"
templates_dir = "/var/www/faucet/templates"

# Blockchain Node Configuration
[blockchain]
rpc_host = "rpc.udaya.net"
rpc_port = 8332
rpc_username = "${RPC_USER}"
rpc_password = "${RPC_PASSWORD}"
rpc_timeout_seconds = 30
max_retries = 3
retry_delay_seconds = 5
dispense_amount = 1000000000  # 10 UDYA in satoshis
max_daily_amount = 10000000000  # 100 UDYA in satoshis
min_confirmations = 1

# Database Configuration
[database]
host = "faucet-db.udaya.net"
port = 5432
username = "${DB_USER}"
password = "${DB_PASSWORD}"
database_name = "udaya_faucet"
max_connections = 20
connection_timeout_seconds = 10
ssl_mode = "require"
cache_size_mb = 256
cache_ttl_seconds = 300

# Faucet Rules Configuration
[rules]
dispense_amount_udya = 10.0
max_daily_udya = 100.0
rate_limit_seconds = 86400  # 24 hours
captcha_required = true
captcha_provider = "recaptcha"
captcha_site_key = "${CAPTCHA_SITE_KEY}"
captcha_secret_key = "${CAPTCHA_SECRET_KEY}"
ip_rate_limiting = true
user_agent_check = true
address_validation = true
min_address_length = 26
max_address_length = 62
address_prefixes = ["udaya1"]

# Security Configuration
[security]
tls_enabled = true
tls_certificate = "/etc/udaya/tls/cert.pem"
tls_key = "/etc/udaya/tls/key.pem"
tls_ca = "/etc/udaya/tls/ca.pem"
cors_allowed_origins = [
    "https://udaya.org",
    "https://explorer.udaya.org",
    "https://docs.udaya.org"
]
rate_limit_requests_per_second = 50
rate_limit_burst = 100
ip_whitelist = []
ip_blacklist = []
api_keys_required = false
csp_policy = "default-src 'self'; script-src 'self' 'unsafe-inline' www.google.com www.gstatic.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; img-src 'self' data: www.google.com www.gstatic.com; font-src 'self' fonts.gstatic.com; connect-src 'self' www.google.com"

# Monitoring Configuration
[monitoring]
prometheus_port = 9090
grafana_port = 3000
alertmanager_port = 9093
metrics_path = "/metrics"
health_check_interval = 15
health_check_timeout = 5
enable_faucet_metrics = true
enable_performance_metrics = true
enable_error_tracking = true
enable_user_analytics = true

# Rate Limiting Configuration
[rate_limiting]
global_limit = 100
per_ip_limit = 50
per_api_key_limit = 100
burst_limit = 200
ban_threshold = 500
ban_duration_minutes = 60
whitelist_ips = [
    "127.0.0.1",
    "::1"
]

# Deployment Configuration
[deployment]
docker_image = "udaya/faucet:1.0.0"
docker_network = "udaya-testnet"
docker_volume = "udaya-faucet-data"
kubernetes_namespace = "udaya-testnet"
kubernetes_replicas = 2
auto_update = true
update_window = "02:00-04:00 UTC"
maintenance_window = "03:00-05:00 UTC"
rolling_update_enabled = true
rolling_update_batch_size = 1

# Backup Configuration
[backup]
enabled = true
interval_hours = 24
retention_days = 30
storage_location = "s3://udaya-backups/testnet/faucet"
encryption_key = "${BACKUP_ENCRYPTION_KEY}"
compression = "zstd"
verify_integrity = true
backup_script = "/usr/local/bin/udaya-faucet-backup.sh"
restore_script = "/usr/local/bin/udaya-faucet-restore.sh"
database_backup_enabled = true
static_files_backup_enabled = true

# Health Check Configuration
[health_check]
enabled = true
interval_seconds = 15
timeout_seconds = 5
max_failures = 3
notification_email = "alerts@udaya.org"
notification_slack = "#udaya-alerts"
notification_pagerduty = "udaya-faucet"
health_check_endpoints = [
    "/health",
    "/api/health"
]

# Alerting Configuration
[alerting]
critical_threshold = 5
warning_threshold = 3
alert_interval_minutes = 5
alert_recovery_minutes = 10
alert_escalation_minutes = 30
alert_contacts = [
    "devops@udaya.org",
    "faucet-support@udaya.org"
]
critical_alerts = [
    "faucet_unavailable",
    "database_connection_failed",
    "rpc_connection_failed",
    "funds_depleted"
]
warning_alerts = [
    "high_cpu_usage",
    "high_memory_usage",
    "slow_response_time",
    "low_funds_warning"
]

# Performance Monitoring
[performance_monitoring]
cpu_threshold_percent = 75
memory_threshold_percent = 70
disk_threshold_percent = 90
network_threshold_mbps = 100
latency_threshold_ms = 100
api_response_threshold_ms = 200
database_query_threshold_ms = 50

# Logging Configuration
[logging]
level = "info"
file = "/var/log/udaya/faucet.log"
max_size_mb = 100
max_files = 10
enable_json = true
enable_console = true
log_api_calls = true
log_database_queries = false
log_sensitive_data = false

# Deployment Scripts
[scripts]
startup = "/usr/local/bin/udaya-faucet-start.sh"
shutdown = "/usr/local/bin/udaya-faucet-stop.sh"
health_check = "/usr/local/bin/udaya-faucet-health.sh"
backup = "/usr/local/bin/udaya-faucet-backup.sh"
restore = "/usr/local/bin/udaya-faucet-restore.sh"
update = "/usr/local/bin/udaya-faucet-update.sh"
rotate_logs = "/usr/local/bin/udaya-faucet-rotate-logs.sh"

# Documentation
[documentation]
setup_guide = "https://docs.udaya.org/faucet-setup"
monitoring_guide = "https://docs.udaya.org/faucet-monitoring"
troubleshooting_guide = "https://docs.udaya.org/faucet-troubleshooting"
api_reference = "https://docs.udaya.org/faucet-api"
security_guide = "https://docs.udaya.org/security-guide"

# Load Balancing Configuration
[load_balancing]
enabled = true
algorithm = "round_robin"
health_check_interval = 10
health_check_timeout = 3
max_retries = 3
sticky_sessions = false
session_timeout_minutes = 5
backend_nodes = [
    "faucet-node-1.udaya.net:8081",
    "faucet-node-2.udaya.net:8081"
]

# CORS Configuration
[cors]
allowed_origins = [
    "https://udaya.org",
    "https://explorer.udaya.org",
    "https://docs.udaya.org",
    "https://testnet.udaya.org"
]
allowed_methods = ["GET", "POST", "OPTIONS"]
allowed_headers = [
    "Content-Type",
    "Authorization",
    "X-Udaya-API-Key",
    "X-Requested-With"
]
max_age_seconds = 86400
credentials_allowed = false

# Feature Flags
[features]
enable_captcha = true
enable_rate_limiting = true
enable_ip_tracking = true
enable_user_analytics = true
enable_dark_mode = true
enable_mobile_optimization = true
enable_api_rate_limiting = true
enable_caching = true
enable_compression = true

# Funds Management
[funds]
initial_funds_udya = 1000000.0  # 1M UDYA
low_funds_threshold_udya = 100000.0  # 100K UDYA
refill_address = "udaya1fundsrefilladdress"
refill_threshold_udya = 500000.0  # 500K UDYA
refill_amount_udya = 1000000.0  # 1M UDYA
auto_refill_enabled = true
refill_notification_email = "funds@udaya.org"

# Analytics Configuration
[analytics]
enabled = true
track_requests = true
track_user_agents = true
track_referrers = true
track_geolocation = true
anonymize_ips = true
retention_days = 365
daily_stats_enabled = true
hourly_stats_enabled = false

# Notification Configuration
[notifications]
email_enabled = true
smtp_host = "smtp.udaya.org"
smtp_port = 587
smtp_username = "${SMTP_USERNAME}"
smtp_password = "${SMTP_PASSWORD}"
smtp_from = "faucet@udaya.org"
email_subject = "Udaya Testnet Faucet - Your UDYA"
email_template = "/var/www/faucet/templates/email.html"
slack_webhook = "${SLACK_WEBHOOK}"
discord_webhook = "${DISCORD_WEBHOOK}"
telegram_bot_token = "${TELEGRAM_BOT_TOKEN}"
telegram_chat_id = "${TELEGRAM_CHAT_ID}"

# Maintenance Configuration
[maintenance]
maintenance_mode = false
maintenance_message = "Faucet is currently under maintenance. Please try again later."
maintenance_start = "00:00 UTC"
maintenance_end = "04:00 UTC"
maintenance_days = ["Sunday"]

# Rate Limit Exceptions
[rate_limit_exceptions]
whitelisted_ips = [
    "127.0.0.1",
    "::1"
]
whitelisted_user_agents = [
    "Udaya-Health-Check",
    "Udaya-Monitor"
]