# Udaya Mainnet Seed Node Configuration
# Deployment-ready configuration for global seed nodes

# Global seed node configuration
[global]
network = "mainnet"
chain = "udaya"
protocol_version = 70015
user_agent = "/Udaya:1.0.0/"
timeout_seconds = 30
max_connections = 1000
max_inbound_connections = 250
max_outbound_connections = 50
ban_threshold = 100
ban_duration_hours = 24

# Seed node locations and configurations
[seed_nodes]

# US East Coast - New York
[[seed_nodes.nodes]]
name = "seed-us-east-1"
location = "New York, USA"
hostname = "seed-us-east-1.udaya.net"
ip_address = "104.248.120.10"
port = 9798
region = "us-east-1"
provider = "aws"
instance_type = "c5.xlarge"
storage_gb = 500
bandwidth_mbps = 1000
monitoring_port = 18332
health_check = "/health"
dns_records = [
    "seed-us-east-1.udaya.net",
    "seed-us-east-1.udaya.org"
]

# US West Coast - San Francisco
