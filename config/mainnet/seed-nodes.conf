# DNS Seed Configuration
[dns_seeds]
primary = "seed.udaya.net"
secondary = "seed.udaya.org"
backup = "dnsseed.udaya.net"
ttl_seconds = 300
refresh_interval_minutes = 15
max_peers_per_seed = 50

# Monitoring Configuration
[monitoring]
prometheus_port = 9090
grafana_port = 3000
alertmanager_port = 9093
metrics_path = "/metrics"
health_check_interval = 30
health_check_timeout = 5

# Security Configuration
[security]
tls_enabled = true
tls_certificate = "/etc/udaya/tls/cert.pem"
tls_key = "/etc/udaya/tls/key.pem"
tls_ca = "/etc/udaya/tls/ca.pem"
rate_limit_requests_per_second = 100
rate_limit_burst = 200
ip_whitelist = []
ip_blacklist = []

# Performance Configuration
[performance]
max_block_size = 1000000
max_mempool_size_mb = 300
max_orphan_blocks = 100
db_cache_size_mb = 4096
max_script_ops = 201
max_sig_ops = 20000
max_tx_size = 100000

# Network Configuration
[network]
listen_address = "0.0.0.0"
external_ip = ""
max_peers = 1000
enable_upnp = false
enable_natpmp = false
enable_dns_seeds = true
enable_peer_exchange = true
peer_connect_timeout = 5
peer_handshake_timeout = 10
peer_inactivity_timeout = 60

# Storage Configuration
[storage]
data_dir = "/data/udaya/mainnet"
prune_blocks = false
prune_target_gb = 0
db_cache_size_mb = 4096
max_db_connections = 128
flush_interval_seconds = 60

# Logging Configuration
[logging]
level = "info"
file = "/var/log/udaya/seed-node.log"
max_size_mb = 100
max_files = 10
enable_json = true
enable_console = true

# Deployment Configuration
[deployment]
docker_image = "udaya/seed-node:1.0.0"
docker_network = "udaya-mainnet"
docker_volume = "udaya-seed-data"
kubernetes_namespace = "udaya-mainnet"
kubernetes_replicas = 1
auto_update = true
update_window = "02:00-04:00 UTC"
maintenance_window = "03:00-05:00 UTC"

# Backup Configuration
[backup]
enabled = true
interval_hours = 24
retention_days = 30
storage_location = "s3://udaya-backups/mainnet/seed-nodes"
encryption_key = "${BACKUP_ENCRYPTION_KEY}"
compression = "zstd"
verify_integrity = true
backup_script = "/usr/local/bin/udaya-backup.sh"
restore_script = "/usr/local/bin/udaya-restore.sh"

# Health Check Configuration
[health_check]
enabled = true
interval_seconds = 30
timeout_seconds = 5
max_failures = 3
notification_email = "alerts@udaya.org"
notification_slack = "#udaya-alerts"
notification_pagerduty = "udaya-seed-nodes"

# Alerting Configuration
[alerting]
critical_threshold = 5
warning_threshold = 3
alert_interval_minutes = 5
alert_recovery_minutes = 10
alert_escalation_minutes = 30
alert_contacts = [
    "devops@udaya.org",
    "seed-nodes@udaya.org"
]

# Performance Monitoring
[performance_monitoring]
cpu_threshold_percent = 90
memory_threshold_percent = 85
disk_threshold_percent = 90
network_threshold_mbps = 800
latency_threshold_ms = 100
block_processing_threshold_ms = 500

# Deployment Scripts
[scripts]
startup = "/usr/local/bin/udaya-seed-start.sh"
shutdown = "/usr/local/bin/udaya-seed-stop.sh"
health_check = "/usr/local/bin/udaya-seed-health.sh"
backup = "/usr/local/bin/udaya-seed-backup.sh"
restore = "/usr/local/bin/udaya-seed-restore.sh"
update = "/usr/local/bin/udaya-seed-update.sh"

# Documentation
[documentation]
setup_guide = "https://docs.udaya.org/seed-node-setup"
monitoring_guide = "https://docs.udaya.org/seed-node-monitoring"
troubleshooting_guide = "https://docs.udaya.org/seed-node-troubleshooting"
api_reference = "https://docs.udaya.org/api-reference"
security_guide = "https://docs.udaya.org/security-guide"