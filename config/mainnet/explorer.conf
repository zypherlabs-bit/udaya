# Udaya Mainnet Block Explorer Configuration
# Deployment-ready configuration for production block explorer

# Global Explorer Configuration
[global]
network = "mainnet"
chain = "udaya"
protocol_version = 70015
user_agent = "/Udaya-Explorer:1.0.0/"
timeout_seconds = 30
max_connections = 1000
ban_threshold = 50
ban_duration_hours = 6

# Explorer Service Configuration
[explorer]
name = "udaya-explorer-mainnet"
location = "Multiple Regions"
hostname = "explorer.udaya.net"
ip_addresses = [
    "104.248.120.110",  # US East
    "172.67.180.110",  # US West
    "104.26.10.110"    # EU Central
]
port = 8080
monitoring_port = 18080
health_check = "/health"
dns_records = [
    "explorer.udaya.net",
    "explorer.udaya.org",
    "mainnet-explorer.udaya.net"
]

# Web Server Configuration
[web_server]
listen_address = "0.0.0.0"
listen_port = 8080
ssl_enabled = true
ssl_certificate = "/etc/udaya/tls/explorer-cert.pem"
ssl_key = "/etc/udaya/tls/explorer-key.pem"
ssl_ca = "/etc/udaya/tls/ca.pem"
max_request_size_mb = 20
max_response_size_mb = 100
max_concurrent_requests = 200
request_timeout_seconds = 30
idle_timeout_seconds = 120
static_files_dir = "/var/www/explorer/static"
templates_dir = "/var/www/explorer/templates"

# Database Configuration
[database]
host = "explorer-db.udaya.net"
port = 5432
username = "${DB_USER}"
password = "${DB_PASSWORD}"
database_name = "udaya_explorer"
max_connections = 50
connection_timeout_seconds = 10
ssl_mode = "require"
cache_size_mb = 1024
cache_ttl_seconds = 600

# Blockchain Node Configuration
[blockchain]
rpc_host = "rpc.udaya.net"
rpc_port = 8332
rpc_username = "${RPC_USER}"
rpc_password = "${RPC_PASSWORD}"
rpc_timeout_seconds = 30
max_retries = 3
retry_delay_seconds = 5
sync_interval_seconds = 60
initial_sync_blocks = 1000
catchup_speed = 10

# Caching Configuration
[caching]
enabled = true
redis_enabled = true
redis_host = "redis.udaya.net"
redis_port = 6379
redis_password = "${REDIS_PASSWORD}"
redis_db = 1
cache_ttl_seconds = 300
block_cache_size = 10000
transaction_cache_size = 100000
address_cache_size = 1000000
mempool_cache_size = 10000

# API Configuration
[api]
enabled = true
api_prefix = "/api"
rest_api_enabled = true
websocket_api_enabled = true
graphql_api_enabled = true
max_pagination_limit = 1000
default_pagination_limit = 50
rate_limit_requests_per_second = 100
rate_limit_burst = 200

# Security Configuration
[security]
tls_enabled = true
tls_certificate = "/etc/udaya/tls/cert.pem"
tls_key = "/etc/udaya/tls/key.pem"
tls_ca = "/etc/udaya/tls/ca.pem"
cors_allowed_origins = [
    "https://udaya.org",
    "https://wallet.udaya.org",
    "https://docs.udaya.org"
]
rate_limit_requests_per_second = 100
rate_limit_burst = 200
ip_whitelist = []
ip_blacklist = []
api_keys_required = false
csp_policy = "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' fonts.googleapis.com; img-src 'self' data:; font-src 'self' fonts.gstatic.com; connect-src 'self' wss://explorer.udaya.net"

# Monitoring Configuration
[monitoring]
prometheus_port = 9090
grafana_port = 3000
alertmanager_port = 9093
metrics_path = "/metrics"
health_check_interval = 15
health_check_timeout = 5
enable_explorer_metrics = true
enable_performance_metrics = true
enable_error_tracking = true
enable_user_analytics = true

# Performance Configuration
[performance]
max_block_processing_threads = 8
max_transaction_processing_threads = 16
max_mempool_size_mb = 1000
db_query_timeout_seconds = 30
api_response_timeout_seconds = 10
max_concurrent_syncs = 4
sync_batch_size = 100

# Search Configuration
[search]
enabled = true
search_backend = "postgres"
full_text_search_enabled = true
search_index_update_interval = 60
max_search_results = 1000
search_cache_size = 10000
search_suggestions_enabled = true
search_suggestions_limit = 10

# WebSocket Configuration
[websocket]
enabled = true
ws_port = 8081
max_connections = 1000
message_queue_size = 1000
ping_interval_seconds = 30
pong_timeout_seconds = 60
max_message_size_mb = 5

# Rate Limiting Configuration
[rate_limiting]
global_limit = 200
per_ip_limit = 100
per_api_key_limit = 200
burst_limit = 500
ban_threshold = 2000
ban_duration_minutes = 30
whitelist_ips = [
    "127.0.0.1",
    "::1"
]

# Deployment Configuration
[deployment]
docker_image = "udaya/explorer:1.0.0"
docker_network = "udaya-mainnet"
docker_volume = "udaya-explorer-data"
kubernetes_namespace = "udaya-mainnet"
kubernetes_replicas = 3
auto_update = true
update_window = "02:00-04:00 UTC"
maintenance_window = "03:00-05:00 UTC"
rolling_update_enabled = true
rolling_update_batch_size = 1

# Backup Configuration
[backup]
enabled = true
interval_hours = 24
retention_days = 30
storage_location = "s3://udaya-backups/mainnet/explorer"
encryption_key = "${BACKUP_ENCRYPTION_KEY}"
compression = "zstd"
verify_integrity = true
backup_script = "/usr/local/bin/udaya-explorer-backup.sh"
restore_script = "/usr/local/bin/udaya-explorer-restore.sh"
database_backup_enabled = true
static_files_backup_enabled = true

# Health Check Configuration
[health_check]
enabled = true
interval_seconds = 15
timeout_seconds = 5
max_failures = 3
notification_email = "alerts@udaya.org"
notification_slack = "#udaya-alerts"
notification_pagerduty = "udaya-explorer"
health_check_endpoints = [
    "/health",
    "/api/health",
    "/ws/health"
]

# Alerting Configuration
[alerting]
critical_threshold = 5
warning_threshold = 3
alert_interval_minutes = 5
alert_recovery_minutes = 10
alert_escalation_minutes = 30
alert_contacts = [
    "devops@udaya.org",
    "explorer-support@udaya.org"
]
critical_alerts = [
    "explorer_unavailable",
    "database_connection_failed",
    "sync_failed",
    "high_latency"
]
warning_alerts = [
    "high_cpu_usage",
    "high_memory_usage",
    "slow_response_time",
    "cache_miss_rate_high"
]

# Performance Monitoring
[performance_monitoring]
cpu_threshold_percent = 80
memory_threshold_percent = 75
disk_threshold_percent = 90
network_threshold_mbps = 500
latency_threshold_ms = 100
api_response_threshold_ms = 200
database_query_threshold_ms = 50
cache_hit_rate_threshold_percent = 90

# Indexing Configuration
[indexing]
enabled = true
index_blocks = true
index_transactions = true
index_addresses = true
index_mempool = true
reindex_on_startup = false
index_batch_size = 1000
index_workers = 8
max_reorg_depth = 100

# Analytics Configuration
[analytics]
enabled = true
track_page_views = true
track_api_calls = true
track_user_agents = true
track_referrers = true
anonymize_ips = true
retention_days = 365
daily_stats_enabled = true
hourly_stats_enabled = false

# Deployment Scripts
[scripts]
startup = "/usr/local/bin/udaya-explorer-start.sh"
shutdown = "/usr/local/bin/udaya-explorer-stop.sh"
health_check = "/usr/local/bin/udaya-explorer-health.sh"
backup = "/usr/local/bin/udaya-explorer-backup.sh"
restore = "/usr/local/bin/udaya-explorer-restore.sh"
update = "/usr/local/bin/udaya-explorer-update.sh"
rotate_logs = "/usr/local/bin/udaya-explorer-rotate-logs.sh"
sync_blocks = "/usr/local/bin/udaya-explorer-sync.sh"

# Documentation
[documentation]
setup_guide = "https://docs.udaya.org/explorer-setup"
monitoring_guide = "https://docs.udaya.org/explorer-monitoring"
troubleshooting_guide = "https://docs.udaya.org/explorer-troubleshooting"
api_reference = "https://docs.udaya.org/explorer-api"
security_guide = "https://docs.udaya.org/security-guide"
performance_guide = "https://docs.udaya.org/explorer-performance"

# Load Balancing Configuration
[load_balancing]
enabled = true
algorithm = "round_robin"
health_check_interval = 10
health_check_timeout = 3
max_retries = 3
sticky_sessions = false
session_timeout_minutes = 10
backend_nodes = [
    "explorer-node-1.udaya.net:8080",
    "explorer-node-2.udaya.net:8080",
    "explorer-node-3.udaya.net:8080"
]

# CORS Configuration
[cors]
allowed_origins = [
    "https://udaya.org",
    "https://wallet.udaya.org",
    "https://docs.udaya.org",
    "https://testnet.udaya.org"
]
allowed_methods = ["GET", "POST", "OPTIONS"]
allowed_headers = [
    "Content-Type",
    "Authorization",
    "X-Udaya-API-Key",
    "X-Requested-With"
]
max_age_seconds = 86400
credentials_allowed = false

# Feature Flags
[features]
enable_mempool_visualization = true
enable_mining_stats = true
enable_governance_stats = true
enable_rich_list = false
enable_privacy_mode = true
enable_dark_mode = true
enable_mobile_optimization = true
enable_api_rate_limiting = true
enable_caching = true
enable_compression = true

# Logging Configuration
[logging]
level = "info"
file = "/var/log/udaya/explorer.log"
max_size_mb = 200
max_files = 20
enable_json = true
enable_console = true
log_api_calls = true
log_database_queries = false
log_sensitive_data = false