# Udaya Mainnet Configuration
# Network identification
network = "mainnet"

# Magic bytes for message identification: 0xBF, 0x59, 0x1A, 0xE7
# Protocol version: 70016

[network]
listen_port = 9798
external_ip = ""
max_peers = 125
enable_upnp = false
preferred_peers = [
    "seed1.Udaya.org:9798",
    "seed2.Udaya.org:9798",
    "seed3.Udaya.org:9798",
    "seed4.Udaya.org:9798",
    "seed5.Udaya.org:9798",
]
ban_duration_secs = 86400

[storage]
data_dir = "/var/lib/Udaya/data"
prune_blocks = false
prune_target_gb = 10
db_cache_size_mb = 2048

[consensus]
network = "mainnet"
min_tx_fee = 1000
max_block_size = 1000000

[mining]
enable = false
mine_on_startup = false
num_miner_threads = 1
coinbase_address = ""

[wallet]
enable = true
wallet_file = "wallet.dat"
default_fee_rate = 10

[rpc]
enable = true
listen_addr = "0.0.0.0"
listen_port = 8332
username = "${RPC_USER:-Udaya}"
password = "${RPC_PASSWORD}"
enable_ws = true
ws_port = 8333
cors_domains = ["https://explorer.Udaya.org", "https://wallet.Udaya.org"]

[logging]
level = "info"
file = "/var/log/Udaya/Udaya.log"
enable_json = true