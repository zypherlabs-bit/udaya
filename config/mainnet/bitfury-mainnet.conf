# Udaya Mainnet Production Configuration
# Global deployment configuration for Udaya mainnet launch

[network]
listen_port = 9798
external_ip = ""
max_peers = 250
enable_upnp = false
preferred_peers = [
    "seed1.Udaya.net:9798",
    "seed2.Udaya.net:9798",
    "seed3.Udaya.net:9798",
    "seed4.Udaya.net:9798",
    "seed5.Udaya.net:9798",
    "seed6.Udaya.net:9798",
    "seed7.Udaya.net:9798",
    "seed8.Udaya.net:9798",
]
ban_duration_secs = 86400
dns_seeds = [
    "seed.Udaya.net",
    "seed.Udaya.io",
    "seed.Udaya.org",
    "dnsseed.Udaya.net",
]

[storage]
data_dir = "/data/Udaya/mainnet"
prune_blocks = false
prune_target_gb = 0
db_cache_size_mb = 4096

[consensus]
network = "mainnet"
min_tx_fee = 1000
max_block_size = 1000000

[mining]
enable = false
mine_on_startup = false
num_miner_threads = 4
coinbase_address = ""

[wallet]
enable = true
wallet_file = "wallet-mainnet.dat"
default_fee_rate = 10

[rpc]
enable = true
listen_addr = "127.0.0.1"
listen_port = 8332
username = "${RPC_USER:-Udaya}"
password = "${RPC_PASSWORD}"
enable_ws = true
ws_port = 8333
cors_domains = ["*"]

[logging]
level = "info"
file = "/var/log/Udaya/mainnet.log"
enable_json = true