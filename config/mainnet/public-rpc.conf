# Udaya Mainnet Public RPC Node Configuration
# Deployment-ready configuration for public RPC endpoints

# Global RPC configuration
[global]
network = "mainnet"
chain = "udaya"
protocol_version = 70015
user_agent = "/Udaya:1.0.0/"
timeout_seconds = 30
max_connections = 500
max_inbound_connections = 200
max_outbound_connections = 50
ban_threshold = 50
ban_duration_hours = 12

# Public RPC Node Configuration
[rpc_node]
name = "public-rpc-mainnet"
location = "Multiple Regions"
hostname = "rpc.udaya.net"
ip_addresses = [
    "104.248.120.100",  # US East
    "172.67.180.100",  # US West
    "104.26.10.100",   # EU Central
    "172.65.200.100",  # EU West
    "104.22.50.100",   # APAC Southeast
    "172.66.150.100"   # APAC Northeast
]
port = 8332
monitoring_port = 18332
health_check = "/health"
dns_records = [
    "rpc.udaya.net",
    "rpc.udaya.org",
    "mainnet-rpc.udaya.net"
]

# RPC Service Configuration
[rpc]
enable = true
listen_address = "0.0.0.0"
listen_port = 8332
username = "${RPC_USER:-public}"
password = "${RPC_PASSWORD}"
enable_ws = true
ws_port = 8333
ssl_enabled = true
ssl_certificate = "/etc/udaya/tls/rpc-cert.pem"
ssl_key = "/etc/udaya/tls/rpc-key.pem"
ssl_ca = "/etc/udaya/tls/ca.pem"
max_request_size_mb = 10
max_response_size_mb = 50
max_concurrent_requests = 100
request_timeout_seconds = 60
idle_timeout_seconds = 300

# Security Configuration
[security]
tls_enabled = true
tls_certificate = "/etc/udaya/tls/cert.pem"
tls_key = "/etc/udaya/tls/key.pem"
tls_ca = "/etc/udaya/tls/ca.pem"
cors_allowed_origins = [
    "https://udaya.org",
    "https://explorer.udaya.org",
    "https://wallet.udaya.org",
    "https://docs.udaya.org"
]
rate_limit_requests_per_second = 50
rate_limit_burst = 100
ip_whitelist = []
ip_blacklist = []
api_keys_required = true
api_key_header = "X-Udaya-API-Key"
max_api_keys_per_user = 5
api_key_expiry_days = 365

# Rate Limiting Configuration
[rate_limiting]
global_limit = 100
per_ip_limit = 50
per_api_key_limit = 100
burst_limit = 200
ban_threshold = 1000
ban_duration_minutes = 60
whitelist_ips = [
    "127.0.0.1",
    "::1"
]

# Authentication Configuration
[authentication]
basic_auth_enabled = true
jwt_auth_enabled = true
jwt_secret = "${JWT_SECRET}"
jwt_expiry_minutes = 60
jwt_issuer = "udaya-rpc"
jwt_audience = "udaya-clients"
session_timeout_minutes = 30
max_sessions_per_user = 5

# Caching Configuration
[caching]
enabled = true
cache_size_mb = 512
cache_ttl_seconds = 300
cache_block_headers = true
cache_block_hashes = true
cache_transaction_index = true
cache_address_balance = true
cache_utxo_set = true
redis_enabled = true
redis_host = "redis.udaya.net"
redis_port = 6379
redis_password = "${REDIS_PASSWORD}"
redis_db = 0

# Monitoring Configuration
[monitoring]
prometheus_port = 9090
grafana_port = 3000
alertmanager_port = 9093
metrics_path = "/metrics"
health_check_interval = 15
health_check_timeout = 5
enable_rpc_metrics = true
enable_performance_metrics = true
enable_error_tracking = true

# Performance Configuration
[performance]
max_block_size = 1000000
max_mempool_size_mb = 500
max_orphan_blocks = 100
db_cache_size_mb = 8192
max_script_ops = 201
max_sig_ops = 20000
max_tx_size = 100000
max_rpc_workers = 20
rpc_queue_size = 1000

# Network Configuration
[network]
listen_address = "0.0.0.0"
external_ip = ""
max_peers = 200
enable_upnp = false
enable_natpmp = false
enable_dns_seeds = true
enable_peer_exchange = true
peer_connect_timeout = 5
peer_handshake_timeout = 10
peer_inactivity_timeout = 60
preferred_peers = [
    "seed-us-east-1.udaya.net:9798",
    "seed-us-west-1.udaya.net:9798",
    "seed-eu-central-1.udaya.net:9798",
    "seed-eu-west-1.udaya.net:9798",
    "seed-ap-southeast-1.udaya.net:9798",
    "seed-ap-northeast-1.udaya.net:9798"
]

# Storage Configuration
[storage]
data_dir = "/data/udaya/mainnet/rpc"
prune_blocks = false
prune_target_gb = 0
db_cache_size_mb = 8192
max_db_connections = 256
flush_interval_seconds = 30
enable_archive_mode = true
archive_retention_days = 365

# Logging Configuration
[logging]
level = "info"
file = "/var/log/udaya/rpc-node.log"
max_size_mb = 200
max_files = 20
enable_json = true
enable_console = true
log_rpc_calls = true
log_sensitive_data = false

# Deployment Configuration
[deployment]
docker_image = "udaya/rpc-node:1.0.0"
docker_network = "udaya-mainnet"
docker_volume = "udaya-rpc-data"
kubernetes_namespace = "udaya-mainnet"
kubernetes_replicas = 3
auto_update = true
update_window = "02:00-04:00 UTC"
maintenance_window = "03:00-05:00 UTC"
rolling_update_enabled = true
rolling_update_batch_size = 1

# Backup Configuration
[backup]
enabled = true
interval_hours = 12
retention_days = 30
storage_location = "s3://udaya-backups/mainnet/rpc-nodes"
encryption_key = "${BACKUP_ENCRYPTION_KEY}"
compression = "zstd"
verify_integrity = true
backup_script = "/usr/local/bin/udaya-rpc-backup.sh"
restore_script = "/usr/local/bin/udaya-rpc-restore.sh"
database_backup_enabled = true
wallet_backup_enabled = false

# Health Check Configuration
[health_check]
enabled = true
interval_seconds = 15
timeout_seconds = 5
max_failures = 3
notification_email = "alerts@udaya.org"
notification_slack = "#udaya-alerts"
notification_pagerduty = "udaya-rpc-nodes"
health_check_endpoints = [
    "/health",
    "/rpc/health",
    "/ws/health"
]

# Alerting Configuration
[alerting]
critical_threshold = 5
warning_threshold = 3
alert_interval_minutes = 5
alert_recovery_minutes = 10
alert_escalation_minutes = 30
alert_contacts = [
    "devops@udaya.org",
    "rpc-support@udaya.org"
]
critical_alerts = [
    "rpc_unavailable",
    "high_latency",
    "authentication_failure",
    "rate_limit_exceeded"
]
warning_alerts = [
    "high_cpu_usage",
    "high_memory_usage",
    "slow_response_time",
    "connection_pool_exhausted"
]

# Performance Monitoring
[performance_monitoring]
cpu_threshold_percent = 85
memory_threshold_percent = 80
disk_threshold_percent = 90
network_threshold_mbps = 800
latency_threshold_ms = 50
block_processing_threshold_ms = 300
rpc_response_threshold_ms = 100
max_queue_size = 500

# API Configuration
[api]
enabled = true
rest_api_enabled = true
websocket_api_enabled = true
graphql_api_enabled = false
swagger_ui_enabled = true
api_documentation_url = "https://docs.udaya.org/api-reference"
max_pagination_limit = 1000
default_pagination_limit = 50

# RPC Methods Configuration
[rpc_methods]
safe_methods = [
    "getblockchaininfo",
    "getblockcount",
    "getblockhash",
    "getblock",
    "getrawtransaction",
    "gettxout",
    "getaddressinfo",
    "getbalance",
    "listunspent",
    "getnetworkinfo",
    "getpeerinfo",
    "getmempoolinfo",
    "getmininginfo"
]
restricted_methods = [
    "sendtoaddress",
    "sendmany",
    "createrawtransaction",
    "signrawtransaction",
    "sendrawtransaction",
    "importprivkey",
    "importaddress",
    "importwallet",
    "backupwallet",
    "walletpassphrase"
]
disabled_methods = [
    "stop",
    "debug",
    "generate",
    "setgenerate",
    "invalidateblock",
    "reconsiderblock"
]

# Deployment Scripts
[scripts]
startup = "/usr/local/bin/udaya-rpc-start.sh"
shutdown = "/usr/local/bin/udaya-rpc-stop.sh"
health_check = "/usr/local/bin/udaya-rpc-health.sh"
backup = "/usr/local/bin/udaya-rpc-backup.sh"
restore = "/usr/local/bin/udaya-rpc-restore.sh"
update = "/usr/local/bin/udaya-rpc-update.sh"
rotate_logs = "/usr/local/bin/udaya-rpc-rotate-logs.sh"

# Documentation
[documentation]
setup_guide = "https://docs.udaya.org/rpc-node-setup"
monitoring_guide = "https://docs.udaya.org/rpc-node-monitoring"
troubleshooting_guide = "https://docs.udaya.org/rpc-node-troubleshooting"
api_reference = "https://docs.udaya.org/api-reference"
security_guide = "https://docs.udaya.org/security-guide"
rate_limiting_guide = "https://docs.udaya.org/rate-limiting-guide"

# Load Balancing Configuration
[load_balancing]
enabled = true
algorithm = "round_robin"
health_check_interval = 10
health_check_timeout = 3
max_retries = 3
sticky_sessions = true
session_timeout_minutes = 30
backend_nodes = [
    "rpc-node-1.udaya.net:8332",
    "rpc-node-2.udaya.net:8332",
    "rpc-node-3.udaya.net:8332"
]

# CORS Configuration
[cors]
allowed_origins = [
    "https://udaya.org",
    "https://explorer.udaya.org",
    "https://wallet.udaya.org",
    "https://docs.udaya.org",
    "https://testnet.udaya.org"
]
allowed_methods = ["GET", "POST", "OPTIONS"]
allowed_headers = [
    "Content-Type",
    "Authorization",
    "X-Udaya-API-Key",
    "X-Requested-With"
]
max_age_seconds = 86400
credentials_allowed = false