# Udaya Public Testnet Configuration

[network]
# P2P network port
listen_port = 19798
# External IP for peer advertisement
external_ip = ""
# Maximum number of peers
max_peers = 50
# Enable UPnP for NAT traversal
enable_upnp = false
# Preferred peers to connect to
preferred_peers = [
    "testnet-seed1.udaya.org:19798",
    "testnet-seed2.udaya.org:19798"
]
# Ban duration in seconds for misbehaving peers
ban_duration_secs = 3600

[storage]
# Data directory for blockchain and wallet data
data_dir = "temp_testnet_data"
# Prune blocks to save disk space
prune_blocks = false
# Target size for pruned blockchain (GB)
prune_target_gb = 5
# Database cache size (MB)
db_cache_size_mb = 256

[consensus]
# Network type: mainnet, testnet, regtest
network = "testnet"
# Minimum transaction fee (satoshis)
min_tx_fee = 100
# Maximum block size (bytes)
max_block_size = 1000000

[mining]
# Enable mining on the node
enable = true
# Start mining on startup
mine_on_startup = true
# Number of miner threads
num_miner_threads = 2
# Coinbase address for mining rewards
coinbase_address = ""

[wallet]
# Enable wallet functionality
enable = true
# Wallet file path
wallet_file = "testnet-wallet.dat"
# Default fee rate (satoshis per vbyte)
default_fee_rate = 5

[rpc]
# Enable RPC server
enable = true
# RPC listen address
listen_addr = "0.0.0.0"
# RPC port
listen_port = 18332
# RPC username - set via environment variable
username = "${RPC_USER:-udaya}"
# RPC password - set via environment variable
password = "${RPC_PASSWORD}"
# Enable WebSocket
enable_ws = true
# WebSocket port
ws_port = 18333
# CORS domains - RESTRICT THESE to specific origins in production
cors_domains = ["*"]

[logging]
# Log level: trace, debug, info, warn, error
level = "debug"
# Log file (empty for stdout)
file = ""
# Enable JSON structured logging
enable_json = false