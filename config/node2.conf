# Udaya Testnet Node 2 Configuration
[network]
listen_port = 19799
external_ip = "127.0.0.1"
max_peers = 50
enable_upnp = false
preferred_peers = [
    "127.0.0.1:19798",
    "127.0.0.1:19800"
]
ban_duration_secs = 3600

[storage]
data_dir = "temp_testnet_data/node2"
prune_blocks = false
prune_target_gb = 5
db_cache_size_mb = 256

[consensus]
network = "testnet"
min_tx_fee = 100
max_block_size = 1000000

[mining]
enable = false
mine_on_startup = true
num_miner_threads = 2
coinbase_address = ""

[wallet]
enable = true
wallet_file = "node2-wallet.dat"
default_fee_rate = 5

[rpc]
enable = true
listen_addr = "0.0.0.0"
listen_port = 18334
username = "udaya"
password = "${RPC_PASSWORD}"
enable_ws = true
ws_port = 18335
cors_domains = ["*"]

[logging]
level = "debug"
file = ""
enable_json = false