# Udaya Testnet Seed Node Configuration Template
# Deploy this on each seed node server

[network]
listen_port = 19798
external_ip = "YOUR_SEED_NODE_IP"
max_peers = 500
enable_upnp = false
preferred_peers = [
    "seed2.testnet.udaya.net:19798",
    "seed3.testnet.udaya.net:19798",
]
ban_duration_secs = 3600

[storage]
data_dir = "/var/lib/udaya/seed"
prune_blocks = false
prune_target_gb = 50
db_cache_size_mb = 2048

[consensus]
network = "testnet"
min_tx_fee = 100
max_block_size = 1000000

[mining]
enable = false
mine_on_startup = false
num_miner_threads = 2
coinbase_address = ""

[wallet]
enable = true
wallet_file = "seed-wallet.dat"
default_fee_rate = 50

[rpc]
enable = true
listen_addr = "127.0.0.1"
listen_port = 18332
username = "${RPC_USER:-udaya}"
password = "${RPC_PASSWORD}"
enable_ws = false
ws_port = 18333
cors_domains = []

[logging]
level = "info"
file = "/var/log/udaya/seed.log"
enable_json = true
