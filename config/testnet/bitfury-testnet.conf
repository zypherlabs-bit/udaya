# Udaya Testnet Configuration
# Public testnet for Udaya mainnet launch preparation

[network]
listen_port = 19798
external_ip = ""
max_peers = 250
enable_upnp = false
preferred_peers = [
    "seed1.testnet.Udaya.net:19798",
    "seed2.testnet.Udaya.net:19798",
    "seed3.testnet.Udaya.net:19798",
    "seed4.testnet.Udaya.net:19798",
]
ban_duration_secs = 3600

[storage]
data_dir = "data/udaya-testnet"
prune_blocks = false
prune_target_gb = 20
db_cache_size_mb = 1024

[consensus]
network = "testnet"
min_tx_fee = 100
max_block_size = 1000000

[mining]
enable = false
mine_on_startup = false
num_miner_threads = 2
coinbase_address = ""

[wallet]
enable = true
wallet_file = "wallet-testnet.dat"
default_fee_rate = 50

[rpc]
enable = true
listen_addr = "0.0.0.0"
listen_port = 18332
username = "${RPC_USER:-Udaya}"
password = "${RPC_PASSWORD}"
enable_ws = true
ws_port = 18333
cors_domains = ["*"]

[logging]
level = "info"
file = "logs/udaya-testnet.log"
enable_json = true