# Udaya Testnet Configuration
network = "testnet"

[network]
listen_port = 19798
external_ip = ""
max_peers = 250
enable_upnp = false
preferred_peers = [
    "testnet-seed1.Udaya.org:19798",
    "testnet-seed2.Udaya.org:19798",
    "testnet-seed3.Udaya.org:19798",
]
ban_duration_secs = 3600

[storage]
data_dir = "/var/lib/Udaya/testnet-data"
prune_blocks = true
prune_target_gb = 2
db_cache_size_mb = 256

[consensus]
network = "testnet"
min_tx_fee = 100
max_block_size = 1000000

[mining]
enable = false
mine_on_startup = false
num_miner_threads = 1
coinbase_address = ""

[wallet]
enable = true
wallet_file = "testnet-wallet.dat"
default_fee_rate = 5

[rpc]
enable = true
listen_addr = "0.0.0.0"
listen_port = 18332
username = "${RPC_USER:-Udaya}"
password = "${RPC_PASSWORD}"
enable_ws = true
ws_port = 18333
cors_domains = ["*"]

[logging]
level = "debug"
file = "/var/log/Udaya/testnet.log"
enable_json = true