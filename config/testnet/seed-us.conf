# Udaya Testnet Seed Node - US East
# Configuration for always-on seed node on Oracle Cloud

[network]
listen_port = 19798
max_peers = 125
enable_upnp = false
ban_duration_secs = 3600

[storage]
data_dir = "/data/udaya"
prune_blocks = false
db_cache_size_mb = 512

[consensus]
network = "testnet"
min_tx_fee = 100
max_block_size = 1000000

[mining]
enable = false
mine_on_startup = false
num_miner_threads = 1

[wallet]
enable = false
default_fee_rate = 5

[rpc]
enable = true
listen_addr = "0.0.0.0"
listen_port = 18332
username = "${RPC_USER}"
password = "${RPC_PASSWORD}"
enable_ws = true
ws_port = 18333
cors_domains = ["https://testnet.udaya.org", "https://explorer.testnet.udaya.org"]

[logging]
level = "info"
file = "/var/log/udaya/testnet-seed-us.log"
enable_json = true