name: Phase 3 Public Alpha Testing

on:
  push:
    branches: [ 'phase3-testing', 'release/phase3*' ]
  pull_request:
    branches: [ 'phase3-testing' ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'all'
        options: ['all', 'installation', 'artifacts', 'cross-platform']

env:
  CARGO_TERM_COLOR: always

jobs:
  # Installation validation workflow
  installation-validation:
    name: Installation Validation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macOS-latest'
        run: |
          brew install pkg-config openssl

      - name: Validate Rust installation
        run: |
          rustc --version
          cargo --version

      - name: Clean build from scratch
        run: |
          git clean -fd
          cargo clean
          cargo build --release

      - name: Verify binaries exist
        run: |
          ls -la target/release/udaya*
          test -f target/release/udayad || exit 1

      - name: Run basic functionality tests
        run: |
          ./target/release/udayad --help || true
          ./target/release/udayad --version || true

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: installation-validation-${{ matrix.os }}
          path: |
            target/release/udaya*
            !target/release/*.d

  # Cross-platform build matrix
  cross-platform-build:
    name: Cross-Platform Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build for target
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary
        run: |
          if [ -f "target/${{ matrix.target }}/release/udayad" ] || [ -f "target/${{ matrix.target }}/release/udayad.exe" ]; then
            echo "Build successful for ${{ matrix.target }}"
            ls -la target/${{ matrix.target }}/release/udaya*
          else
            echo "Binary not found for ${{ matrix.target }}"
            exit 1
          fi

      - name: Upload cross-platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cross-build-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/udaya*

  # Artifact reproducibility verification
  artifact-reproducibility:
    name: Artifact Reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: First clean build
        run: |
          git clean -fd
          cargo clean
          cargo build --release
          cp target/release/udayad udayad-first

      - name: Second clean build
        run: |
          git clean -fd
          cargo clean
          cargo build --release
          cp target/release/udayad udayad-second

      - name: Compare binaries
        run: |
          if diff udayad-first udayad-second; then
            echo "✅ Binaries are identical - build is reproducible"
          else
            echo "❌ Binaries differ - build is NOT reproducible"
            sha256sum udayad-first udayad-second
            exit 1
          fi

      - name: Generate checksums
        run: |
          sha256sum target/release/udaya* > release-checksums.sha256
          cat release-checksums.sha256

      - name: Upload reproducibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-checksums
          path: |
            release-checksums.sha256
            udayad-first
            udayad-second

  # Docker multi-arch build validation
  docker-multiarch:
    name: Docker Multi-Arch Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch images
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag udaya-node:phase3-testing \
            --file deployments/docker/Dockerfile \
            --load .

      - name: Test Docker image
        run: |
          docker run --rm udaya-node:phase3-testing --version

      - name: Save Docker image
        run: |
          docker save udaya-node:phase3-testing -o udaya-node-phase3.tar

      - name: Upload Docker artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-multiarch
          path: udaya-node-phase3.tar

  # Kubernetes manifest validation
  kubernetes-validation:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y kubectl

      - name: Validate Kubernetes manifests
        run: |
          for manifest in deployments/k8s/*.yaml; do
            echo "Validating $manifest"
            kubectl apply --dry-run=client -f "$manifest" || exit 1
          done

      - name: Check Helm charts (if available)
        run: |
          if [ -d "deployments/helm" ]; then
            echo "Helm charts found, installing helm..."
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            helm lint deployments/helm/*
          else
            echo "No Helm charts found"
          fi

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-validation
          path: deployments/k8s/

  # Documentation validation
  documentation-validation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for required documentation
        run: |
          # Check for essential documentation files
          required_docs=(
            "README.md"
            "CONTRIBUTING.md"
            "docs/operations/getting-started.md"
            "docs/architecture/README.md"
            "docs/developer/README.md"
            "docs/operations/phase3-testing-plan.md"
            "docs/operations/phase3-testing-results.md"
          )

          missing_docs=()
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              missing_docs+=("$doc")
            fi
          done

          if [ ${#missing_docs[@]} -gt 0 ]; then
            echo "❌ Missing documentation files:"
            for doc in "${missing_docs[@]}"; do
              echo "  - $doc"
            done
            exit 1
          else
            echo "✅ All required documentation files present"
          fi

      - name: Check for broken links in markdown
        run: |
          find . -name "*.md" -exec grep -l "http" {} \; | while read file; do
            echo "Checking links in $file"
            # Simple check for common patterns that might be broken
            grep -E "(http://|https://)" "$file" | grep -v "github.com" | grep -v "udaya.org" || true
          done

      - name: Validate TOML files
        run: |
          find . -name "*.toml" -exec echo "Validating {}" \; -exec cat {} \; | grep -E "^\[" || true

      - name: Generate documentation report
        run: |
          echo "Documentation Validation Report" > doc-validation-report.txt
          echo "==============================" >> doc-validation-report.txt
          echo "" >> doc-validation-report.txt
          echo "Essential Files:" >> doc-validation-report.txt
          ls -la README.md CONTRIBUTING.md LICENSE >> doc-validation-report.txt
          echo "" >> doc-validation-report.txt
          echo "Documentation Directories:" >> doc-validation-report.txt
          find docs -type d -maxdepth 2 >> doc-validation-report.txt

      - name: Upload documentation report
        uses: actions/upload-artifact@v4
        with:
          name: documentation-validation
          path: doc-validation-report.txt

  # Test coverage analysis
  test-coverage:
    name: Test Coverage Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: lcov.info

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.2.16
        with:
          lcov-file: lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Performance benchmarking
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmarks
        run: cargo bench --all -- --verbose

      - name: Save benchmark results
        run: |
          mkdir -p benchmark-results
          cargo bench --all -- --verbose 2>&1 | tee benchmark-results/results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmarks
          path: benchmark-results/

  # Summary and reporting
  testing-summary:
    name: Testing Summary
    needs: [
      installation-validation,
      cross-platform-build,
      artifact-reproducibility,
      docker-multiarch,
      kubernetes-validation,
      documentation-validation,
      test-coverage,
      performance-benchmark
    ]
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary report
        run: |
          echo "Udaya Phase 3 Public Alpha Testing Summary" > testing-summary.md
          echo "==========================================" >> testing-summary.md
          echo "" >> testing-summary.md
          echo "## Test Results Overview" >> testing-summary.md
          echo "" >> testing-summary.md
          echo "- **Installation Validation**: ✅ Completed" >> testing-summary.md
          echo "- **Cross-Platform Build**: ✅ Completed" >> testing-summary.md
          echo "- **Artifact Reproducibility**: ✅ Completed" >> testing-summary.md
          echo "- **Docker Multi-Arch**: ✅ Completed" >> testing-summary.md
          echo "- **Kubernetes Validation**: ✅ Completed" >> testing-summary.md
          echo "- **Documentation Validation**: ✅ Completed" >> testing-summary.md
          echo "- **Test Coverage**: ✅ Completed" >> testing-summary.md
          echo "- **Performance Benchmark**: ✅ Completed" >> testing-summary.md
          echo "" >> testing-summary.md
          echo "## Platform Coverage" >> testing-summary.md
          echo "" >> testing-summary.md
          echo "- Ubuntu Linux: ✅ Tested" >> testing-summary.md
          echo "- Windows: ✅ Tested" >> testing-summary.md
          echo "- macOS: ✅ Tested" >> testing-summary.md
          echo "- Cross-compilation: ✅ Tested" >> testing-summary.md
          echo "" >> testing-summary.md
          echo "## Artifact Status" >> testing-summary.md
          echo "" >> testing-summary.md
          echo "- Binary reproducibility: ✅ Verified" >> testing-summary.md
          echo "- Docker images: ✅ Built and tested" >> testing-summary.md
          echo "- Kubernetes manifests: ✅ Validated" >> testing-summary.md
          echo "- Documentation: ✅ Complete" >> testing-summary.md
          echo "" >> testing-summary.md
          echo "## Next Steps" >> testing-summary.md
          echo "" >> testing-summary.md
          echo "1. Review test results in GitHub Actions" >> testing-summary.md
          echo "2. Download artifacts for manual testing" >> testing-summary.md
          echo "3. Update phase3-testing-results.md with findings" >> testing-summary.md
          echo "4. Prepare for community testing announcement" >> testing-summary.md

      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: testing-summary
          path: testing-summary.md

      - name: Comment on PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('testing-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Phase 3 Testing Summary\n\n${summary}\n\n🎉 All automated tests passed! Ready for community testing.`
            })