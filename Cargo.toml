[workspace]
resolver = "2"
members = [
    "src",
    "src/core",
    "src/storage",
    "src/mempool",
    "src/p2p",
    "src/wallet",
    "src/explorer",
    "src/mining",
    "src/api",
    "src/miner",
    "src/faucet",
    "src/wallet-cli",
    "src/pool-server",
    "e2e-validation",
]

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/udayafoundation/udaya"
description = "UDAYA - Next-generation Proof-of-Work cryptocurrency"

[workspace.dependencies]
sha2 = "0.10"
ripemd = "0.1"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
rocksdb = { version = "0.23", features = ["mt_static"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rayon = "1.8"
num-bigint = "0.4"
num-traits = "0.2"
byteorder = "1.5"
lazy_static = "1.4"
dashmap = "5.5"
crossbeam = "0.8"
parking_lot = "0.12"
futures = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
base58 = "0.2"
secp256k1 = { version = "0.28", features = ["rand-std", "serde", "recovery"] }
bitcoin_hashes = "0.12"
sled = "0.34"
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = { version = "0.13", features = ["process"] }
reqwest = { version = "0.11", features = ["json"] }
prost = "0.12"
tonic = "0.10"
tower = "0.4"
hyper = { version = "1.1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
jsonwebtoken = "9"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
blake3 = "1.5"
ed25519-dalek = "2"
x25519-dalek = "2"
ring = "0.17"
aes-gcm = "0.10"
toml = "0.8"
tempfile = "3.8"