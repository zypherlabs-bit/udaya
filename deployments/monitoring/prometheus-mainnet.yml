    static_configs:
      - targets:
          - "faucet-node-1.udaya.net:18081"
          - "faucet-node-2.udaya.net:18081"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*):18081"
        replacement: "$1"
      - target_label: service
        replacement: "udaya-faucet"

# Remote write configuration for long-term storage
remote_write:
  - url: "https://thanos-receiver.udaya.net:19291/api/v1/receive"
    queue_config:
      max_samples_per_send: 1000
      max_shards: 200
      capacity: 2500
    tls_config:
      ca_file: /etc/prometheus/tls/ca.pem
      cert_file: /etc/prometheus/tls/cert.pem
      key_file: /etc/prometheus/tls/key.pem

# Remote read configuration for long-term queries
remote_read:
  - url: "https://thanos-query.udaya.net:19192"
    tls_config:
      ca_file: /etc/prometheus/tls/ca.pem
      cert_file: /etc/prometheus/tls/cert.pem
      key_file: /etc/prometheus/tls/key.pem
    timeout: 30s

# Service discovery configuration
service_discovery:
  kubernetes_sd_configs:
    - role: pod
      namespaces:
        names: ["udaya-mainnet"]
      api_server: "https://kubernetes-api.udaya.net"
      tls_config:
        ca_file: /etc/prometheus/k8s/ca.pem
        cert_file: /etc/prometheus/k8s/cert.pem
        key_file: /etc/prometheus/k8s/key.pem
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

  consul_sd_configs:
    - server: "consul.udaya.net:8500"
      services: ["udaya-seed-node", "udaya-rpc-node", "udaya-explorer", "udaya-faucet"]
      scheme: https
      tls_config:
        ca_file: /etc/prometheus/consul/ca.pem
        cert_file: /etc/prometheus/consul/cert.pem
        key_file: /etc/prometheus/consul/key.pem

# Alertmanager configuration for high availability
alertmanager_config:
  - scheme: https
    static_configs:
      - targets:
          - "alertmanager-mainnet-1.udaya.net:9093"
          - "alertmanager-mainnet-2.udaya.net:9093"
          - "alertmanager-mainnet-3.udaya.net:9093"
    tls_config:
      ca_file: /etc/prometheus/tls/ca.pem
      cert_file: /etc/prometheus/tls/cert.pem
      key_file: /etc/prometheus/tls/key.pem
    timeout: 10s
    api_version: v2