  # Udaya Monitoring Infrastructure
  - job_name: "udaya-monitoring"
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/tls/ca.pem
      cert_file: /etc/prometheus/tls/cert.pem
      key_file: /etc/prometheus/tls/key.pem
    static_configs:
      - targets:
          - "grafana-mainnet.udaya.net:3000"
          - "alertmanager-mainnet-1.udaya.net:9093"
          - "alertmanager-mainnet-2.udaya.net:9093"
          - "alertmanager-mainnet-3.udaya.net:9093"
    relabel_configs:
      - source_labels: [__address__]
