# Udaya Mainnet Prometheus Monitoring Configuration
# Comprehensive monitoring for production mainnet deployment

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: "mainnet"
    network: "udaya"
    cluster: "udaya-mainnet"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager-mainnet-1.udaya.net:9093"
            - "alertmanager-mainnet-2.udaya.net:9093"
            - "alertmanager-mainnet-3.udaya.net:9093"
      scheme: https
      tls_config:
        ca_file: /etc/prometheus/tls/ca.pem
        cert_file: /etc/prometheus/tls/cert.pem
        key_file: /etc/prometheus/tls/key.pem
      timeout: 10s
      api_version: v2

# Rule files for alerting
rule_files:
  - "/etc/prometheus/rules/alert.rules"
  - "/etc/prometheus/rules/blockchain.rules"
  - "/etc/prometheus/rules/performance.rules"
  - "/etc/prometheus/rules/security.rules"
  - "/etc/prometheus/rules/network.rules"

# Scrape configurations
scrape_configs:

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
          - "prometheus-mainnet-1.udaya.net:9090"
          - "prometheus-mainnet-2.udaya.net:9090"
          - "prometheus-mainnet-3.udaya.net:9090"
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/tls/ca.pem
      cert_file: /etc/prometheus/tls/cert.pem
      key_file: /etc/prometheus/tls/key.pem
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true

  # Udaya Mainnet Seed Nodes
  - job_name: "udaya-mainnet-seed-nodes"
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/tls/ca.pem
      cert_file: /etc/prometheus/tls/cert.pem
      key_file: /etc/prometheus/tls/key.pem
    static_configs:
      - targets:
          - "seed-us-east-1.udaya.net:18332"
          - "seed-us-west-1.udaya.net:18332"
          - "seed-eu-central-1.udaya.net:18332"
          - "seed-eu-west-1.udaya.net:18332"
          - "seed-ap-southeast-1.udaya.net:18332"
          - "seed-ap-northeast-1.udaya.net:18332"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*):18332"
        replacement: "$1"
      - source_labels: [__address__]
        target_label: region
        regex: "seed-(.*)-.*"
        replacement: "$1"
      - target_label: service
        replacement: "udaya-seed-node"

  # Udaya Mainnet Public RPC Nodes
  - job_name: "udaya-mainnet-rpc-nodes"
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/tls/ca.pem
      cert_file: /etc/prometheus/tls/cert.pem
      key_file: /etc/prometheus/tls/key.pem
    static_configs:
      - targets:
          - "rpc-node-1.udaya.net:18332"
          - "rpc-node-2.udaya.net:18332"
          - "rpc-node-3.udaya.net:18332"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*):18332"
        replacement: "$1"
      - target_label: service
        replacement: "udaya-rpc-node"

  # Udaya Mainnet Explorer
  - job_name: "udaya-mainnet-explorer"
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: "/metrics"
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/tls/ca.pem
      cert_file: /etc/prometheus/tls/cert.pem
      key_file: /etc/prometheus/tls/key.pem
    static_configs:
      - targets:
          - "explorer-node-1.udaya.net:18080"
          - "explorer-node-2.udaya.net:18080"
          - "explorer-node-3.udaya.net:18080"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*):18080"
        replacement: "$1"
      - target_label: service
        replacement: "udaya-explorer"

  # Udaya Testnet Faucet
  - job_name: "udaya-testnet-faucet"
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: "/metrics"
    scheme: https
