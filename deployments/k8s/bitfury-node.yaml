apiVersion: v1
kind: Namespace
metadata:
  name: Udaya
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: udaya.config
  namespace: Udaya
data:
  udaya.conf: |
    [network]
    listen_port = 9798
    max_peers = 250
    preferred_peers = [
        "seed1.Udaya.net:9798",
        "seed2.Udaya.net:9798",
        "seed3.Udaya.net:9798",
    ]
    dns_seeds = [
        "seed.Udaya.net",
        "seed.Udaya.io",
    ]
    [storage]
    data_dir = "/data/Udaya/mainnet"
    db_cache_size_mb = 4096
    [consensus]
    network = "mainnet"
    min_tx_fee = 1000
    [mining]
    enable = false
    [rpc]
    enable = true
    listen_addr = "0.0.0.0"
    listen_port = 8332
    enable_ws = true
    ws_port = 8333
    [logging]
    level = "info"
    enable_json = true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: Udaya-seed
  namespace: Udaya
  labels:
    app: Udaya
    role: seed-node
spec:
  serviceName: Udaya-seed
  replicas: 3
  selector:
    matchLabels:
      app: Udaya
      role: seed-node
  template:
    metadata:
      labels:
        app: Udaya
        role: seed-node
    spec:
      containers:
      - name: udayad
        image: Udaya/node:latest
        args: ["-c", "/etc/Udaya/udaya.conf", "start"]
        ports:
        - containerPort: 9798
          name: p2p
        - containerPort: 8332
          name: rpc
        - containerPort: 8333
          name: ws
        resources:
          requests:
            memory: "4Gi"
            cpu: "4"
          limits:
            memory: "8Gi"
            cpu: "8"
        volumeMounts:
        - name: config
          mountPath: /etc/Udaya
        - name: data
          mountPath: /data/Udaya
        livenessProbe:
          tcpSocket:
            port: 9798
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8332
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: udaya.config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 500Gi
      storageClassName: ssd
---
apiVersion: v1
kind: Service
metadata:
  name: Udaya-seed
  namespace: Udaya
spec:
  selector:
    app: Udaya
    role: seed-node
  ports:
  - name: p2p
    port: 9798
    targetPort: 9798
  - name: rpc
    port: 8332
    targetPort: 8332
  - name: ws
    port: 8333
    targetPort: 8333
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: Udaya-rpc
  namespace: Udaya
spec:
  selector:
    app: Udaya
    role: seed-node
  ports:
  - name: rpc
    port: 8332
    targetPort: 8332
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: Udaya-seed-hpa
  namespace: Udaya
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: Udaya-seed
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: Udaya-monitor
  namespace: Udaya
spec:
  selector:
    matchLabels:
      app: Udaya
  endpoints:
  - port: rpc
    interval: 15s