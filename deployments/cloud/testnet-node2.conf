# Udaya Testnet Node 2 Configuration (Cloud)
# Role: Sync/relay node

[network]
listen_port = 19799
external_ip = "__EXTERNAL_IP_NODE2__"
max_peers = 25
enable_upnp = false
preferred_peers = [
    "__EXTERNAL_IP_NODE1__:19798",
    "__EXTERNAL_IP_NODE3__:19800"
]
ban_duration_secs = 3600

[storage]
data_dir = "/var/lib/udaya/node2"
prune_blocks = false
prune_target_gb = 20
db_cache_size_mb = 256

[consensus]
network = "testnet"
min_tx_fee = 100
max_block_size = 1000000

[mining]
enable = false
mine_on_startup = false
num_miner_threads = 1
coinbase_address = ""

[wallet]
enable = true
wallet_file = "node2-wallet.dat"
default_fee_rate = 50

[rpc]
enable = true
listen_addr = "127.0.0.1"
listen_port = 18334
username = "${RPC_USER:-udaya}"
password = "${RPC_PASSWORD}"
enable_ws = false
ws_port = 18335
cors_domains = []
rate_limit_rps = 10
rate_limit_burst = 20
max_request_size_mb = 10
max_connections = 50
restricted_methods = [
    "importprivkey",
    "dumpprivkey",
    "signrawtransactionwithkey",
    "walletpassphrase",
    "walletpassphrasechange",
    "walletlock",
    "encryptwallet"
]

[logging]
level = "info"
file = "/var/log/udaya/node2.log"
enable_json = true