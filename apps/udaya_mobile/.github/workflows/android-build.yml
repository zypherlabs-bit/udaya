name: Android Build & Deploy

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install Android NDK
        run: |
          echo "ndkVersion=30.0.14904198" >> $GITHUB_ENV

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/ffi-mobile/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/ffi-mobile/Cargo.toml') }}

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}

      - name: Get Flutter dependencies
        working-directory: apps/udaya_mobile
        run: flutter pub get

      - name: Build Rust FFI for Android
        working-directory: .
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o apps/udaya_mobile/android/app/src/main/jniLibs \
            --manifest-path src/ffi-mobile/Cargo.toml \
            -P 29 \
            build --release

      - name: Run Flutter analyze
        working-directory: apps/udaya_mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/udaya_mobile
        run: flutter test

      - name: Build debug APK
        working-directory: apps/udaya_mobile
        run: flutter build apk --debug

      - name: Build release AAB
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/udaya_mobile
        run: flutter build appbundle --release
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apps/udaya_mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload release AAB
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: apps/udaya_mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.udaya.mobile
          releaseFiles: apps/udaya_mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
